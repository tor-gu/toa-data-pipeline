[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
# Each Lambda directory is its own flat module namespace, so tests import the
# module under test by bare name. Only directories with tests are listed, which
# keeps those bare names unambiguous.
pythonpath = [
    "../toa-lambda-layer-common/python",
    "dynamodb-writer",
    "names-consolidator",
    "scores-enricher",
    "scores-updater",
    "statistics-builder",
    "viz-builder",
]
